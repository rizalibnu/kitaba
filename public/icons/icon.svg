<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B5E20;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Gold border accent -->
  <rect x="16" y="16" width="480" height="480" rx="80" fill="none" stroke="#C6922B" stroke-width="4" opacity="0.6"/>
  <!-- Arabic calligraphy: نسخ (Naskh) -->
  <text x="256" y="300" font-family="'Amiri', 'Noto Naskh Arabic', serif" font-size="200" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" direction="rtl">نسخ</text>
  <!-- Pen nib icon at bottom -->
  <path d="M240 400 L256 440 L272 400" stroke="#C6922B" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
